services:
  - type: web
    name: mnnit-chess-club-api
    runtime: go
    rootDir: api
    plan: free
    buildCommand: go build -o server ./cmd
    startCommand: ./server
    envVars:
      - key: APP_ENV
        value: prod

      - key: COOKIE_SAMESITE
        value: lax

      - key: COOKIE_SECURE
        value: "true"

      # External Neon PostgreSQL database
      - key: DATABASE_URL
        sync: false

      - key: BASE_URL
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false
